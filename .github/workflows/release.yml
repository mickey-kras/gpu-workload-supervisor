name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  entry:
    name: read release version from main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Require dispatch from main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            if (context.eventName !== 'workflow_dispatch' || context.ref !== 'refs/heads/main') {
              throw new Error('Release dispatch is allowed only from main');
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install release tools
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
      - name: Read planned release version
        id: version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const { releaseVersion } = require('./.github/scripts/release-follow-up.cjs');
            core.setOutput('version', releaseVersion(readFileSync('release-version.json', 'utf8')));
  validation:
    name: verify exact-commit main validation
    needs: entry
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact-commit main validation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ needs.entry.outputs.version }}
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const { createHash } = require('node:crypto');
            const { resolve } = require('node:path');
            const { compileFunction } = require('node:vm');
            const filename = resolve('.github/scripts/release-validation.cjs');
            const source = readFileSync(filename);
            if (createHash('sha256').update(source).digest('hex') !==
                '2ab673a761d632d643901cfdd9294d45135910691481693bcb15b2f20fc75c1b') {
              throw new Error('Release validation verifier bytes changed in the workspace');
            }
            const publicationFilename = resolve('.github/scripts/release-publication.cjs');
            const publicationSource = readFileSync(publicationFilename);
            if (createHash('sha256').update(publicationSource).digest('hex') !==
                '124d6832b052c0f3309755c1874acf303bbef264cf24077e1831dacc51838462') {
              throw new Error('Release publication helper bytes changed in the workspace');
            }
            const publication = { exports: {} };
            const noImports = () => { throw new Error('Unexpected publication helper dependency'); };
            compileFunction(publicationSource.toString('utf8'), ['require', 'module', 'exports'],
              { filename: publicationFilename })(noImports, publication, publication.exports);
            const closedRequire = name => {
              if (name !== './release-publication.cjs') throw new Error('Unexpected validation dependency');
              return publication.exports;
            };
            const validated = { exports: {} };
            compileFunction(source.toString('utf8'), ['require', 'module', 'exports'], { filename })(
              closedRequire, validated, validated.exports,
            );
            await validated.exports.verifyMain({
              github, context, core, version: process.env.VERSION,
            });
  publish:
    name: publish source and binaries v${{ needs.entry.outputs.version }}
    needs: [entry, validation]
    runs-on: ubuntu-latest
    environment: release-automation
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install release tools
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
      - name: Verify main and successful validation at this commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ needs.entry.outputs.version }}
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const { createHash } = require('node:crypto');
            const { resolve } = require('node:path');
            const { compileFunction } = require('node:vm');
            const filename = resolve('.github/scripts/release-validation.cjs');
            const source = readFileSync(filename);
            if (createHash('sha256').update(source).digest('hex') !==
                '2ab673a761d632d643901cfdd9294d45135910691481693bcb15b2f20fc75c1b') {
              throw new Error('Release validation verifier bytes changed in the workspace');
            }
            const publicationFilename = resolve('.github/scripts/release-publication.cjs');
            const publicationSource = readFileSync(publicationFilename);
            if (createHash('sha256').update(publicationSource).digest('hex') !==
                '124d6832b052c0f3309755c1874acf303bbef264cf24077e1831dacc51838462') {
              throw new Error('Release publication helper bytes changed in the workspace');
            }
            const publication = { exports: {} };
            const noImports = () => { throw new Error('Unexpected publication helper dependency'); };
            compileFunction(publicationSource.toString('utf8'), ['require', 'module', 'exports'],
              { filename: publicationFilename })(noImports, publication, publication.exports);
            const closedRequire = name => {
              if (name !== './release-publication.cjs') throw new Error('Unexpected validation dependency');
              return publication.exports;
            };
            const validated = { exports: {} };
            compileFunction(source.toString('utf8'), ['require', 'module', 'exports'], { filename })(
              closedRequire, validated, validated.exports,
            );
            await validated.exports.verifyMain({
              github, context, core, version: process.env.VERSION,
            });
      - name: Release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Verify immutable setting and publication state
        id: state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ needs.entry.outputs.version }}
          RELEASE_SETTINGS_REVIEW: ${{ vars.RELEASE_SETTINGS_REVIEW }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/release-settings.cjs').verify({
              github, context, review: process.env.RELEASE_SETTINGS_REVIEW,
            });
            const tag = `v${process.env.VERSION}`;
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('published', 'false');
              return;
            }
            await require('./.github/scripts/release-follow-up.cjs').verifyPublished({
              github, context, version: process.env.VERSION,
            });
            core.setOutput('published', 'true');
      - name: Verify existing release checksum
        if: steps.state.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.entry.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir existing-release
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" --dir existing-release
          cd existing-release
          sha256sum --check SHA256SUMS
      - name: Freeze main in a release branch
        if: steps.state.outputs.published != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ needs.entry.outputs.version }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const ref = `heads/release/${process.env.VERSION}`;
            const { data: main } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            try {
              const { data: existing } = await github.rest.git.getRef({ ...context.repo, ref });
              if (existing.object.sha !== context.sha) throw new Error('Release branch belongs to another commit');
              core.info('Reusing the prepared release branch');
            } catch (error) {
              if (error.status !== 404) throw error;
              if (main.commit.sha !== context.sha) throw new Error('Main moved before preparation');
              await github.rest.git.createRef({ ...context.repo, ref: `refs/${ref}`, sha: context.sha });
            }
      - name: Prepare local release tag
        if: steps.state.outputs.published != 'true'
        env:
          VERSION: ${{ needs.entry.outputs.version }}
        run: git tag "v${VERSION}" "$GITHUB_SHA"
      - name: Install verified GoReleaser
        if: steps.state.outputs.published != 'true'
        uses: ./.github/actions/setup-goreleaser
      - name: Build deployable binaries
        if: steps.state.outputs.published != 'true'
        run: goreleaser release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build source archive and stage binaries
        if: steps.state.outputs.published != 'true'
        env:
          VERSION: ${{ needs.entry.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          archive="gpu-workload-supervisor-v${VERSION}.tar.gz"
          git archive --format=tar --prefix="gpu-workload-supervisor-v${VERSION}/" HEAD | gzip -n > "release-assets/$archive"
          for arch in amd64 arm64; do
            artifact="gpu-workload-supervisor_${VERSION}_linux_${arch}.tar.gz"
            test -s "dist/$artifact"
            tar -tzf "dist/$artifact" | grep -E '(^|/)gpu-mode$' > /dev/null
            tar -tzf "dist/$artifact" | grep -E '(^|/)gpu-workload-proxy$' > /dev/null
            bash scripts/check-archive-notices.sh "dist/$artifact"
            cp "dist/$artifact" "release-assets/$artifact"
          done
          (cd dist && sha256sum --check checksums.txt)
      - name: Build desktop packages
        if: steps.state.outputs.published != 'true'
        env:
          VERSION: ${{ needs.entry.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            artifact="gpu-workload-supervisor_${VERSION}_linux_${arch}.deb"
            test -s "dist/$artifact"
            bash scripts/check-desktop-package.sh "dist/$artifact"
            cp "dist/$artifact" "release-assets/$artifact"
          done
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        if: steps.state.outputs.published != 'true'
        with:
          version: v0.71.2
      - name: Generate CycloneDX SBOM
        if: steps.state.outputs.published != 'true'
        run: trivy fs --skip-dirs dist --skip-dirs release-assets --format cyclonedx --output release-assets/sbom.cdx.json .
      - name: Checksum all release assets
        if: steps.state.outputs.published != 'true'
        run: |
          cd release-assets
          sha256sum gpu-workload-supervisor*.tar.gz sbom.cdx.json > SHA256SUMS
          sha256sum gpu-workload-supervisor*.deb >> SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest release assets
        if: steps.state.outputs.published != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.deb
            release-assets/SHA256SUMS
            release-assets/sbom.cdx.json
      - name: Publish immutable GitHub release
        if: steps.state.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.entry.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          notes_args=()
          notes_file="docs/releases/v${VERSION}.md"
          if [[ -s "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          fi
          gh release create "v${VERSION}" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "v${VERSION}" --generate-notes "${notes_args[@]}"
      - name: Verify published release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ needs.entry.outputs.version }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/release-follow-up.cjs').verifyPublished({
              github, context, version: process.env.VERSION,
            });
      - name: Delete published release branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ needs.entry.outputs.version }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const ref = `heads/release/${process.env.VERSION}`;
            try {
              const { data: branch } = await github.rest.git.getRef({ ...context.repo, ref });
              if (branch.object.sha !== context.sha) throw new Error('Release branch SHA changed');
              await github.rest.git.deleteRef({ ...context.repo, ref });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Release branch already removed');
            }

  release-followup:
    name: reserve next patch after v${{ needs.entry.outputs.version }}
    needs: [entry, publish]
    runs-on: ubuntu-latest
    environment: release-automation
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install release tools
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
      - name: Release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Queue narrowly validated next patch bump
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.entry.outputs.version }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/release-follow-up.cjs').bumpReleasedVersion({
              github, context, core, version: process.env.VERSION,
            });

