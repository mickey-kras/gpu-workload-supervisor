name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  entry:
    name: read release version from main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Require dispatch from main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            if (context.eventName !== 'workflow_dispatch' || context.ref !== 'refs/heads/main') {
              throw new Error('Release dispatch is allowed only from main');
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install release tools
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
      - name: Read planned release version
        id: version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const { releaseVersion } = require('./.github/scripts/release-follow-up.cjs');
            core.setOutput('version', releaseVersion(readFileSync('release-version.json', 'utf8')));
  quality:
    needs: entry
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml
  aislop:
    needs: entry
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/aislop.yml
  codeql:
    needs: entry
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
  publish:
    name: publish source and binaries v${{ needs.entry.outputs.version }}
    needs: [entry, quality, aislop, codeql]
    runs-on: ubuntu-latest
    environment: release-automation
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install release tools
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
      - name: Verify main and successful validation at this commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ needs.entry.outputs.version }}
        with:
          script: |
            const version = process.env.VERSION;
            if (context.ref !== 'refs/heads/main' ||
                !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
              throw new Error('Release requires main and a plain SemVer version');
            }
            const { data: tip } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (tip.commit.sha !== context.sha) {
              const ref = `heads/release/${version}`;
              try {
                const { data: candidate } = await github.rest.git.getRef({ ...context.repo, ref });
                if (candidate.object.sha !== context.sha) throw new Error('Main moved and the prepared branch has another SHA');
                core.info('Retrying the prepared commit after main advanced');
              } catch (error) {
                if (error.status !== 404) throw error;
                await require('./.github/scripts/release-follow-up.cjs').verifyPublished({
                  github, context, version,
                });
                core.info('Retrying the published commit after branch cleanup');
              }
            }
            // The release can be dispatched while main's Sonar job is still running.
            // Wait for the exact dispatch commit, preserving the successful-main gate.
            let validated = false;
            for (let attempt = 0; attempt < 20; attempt++) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo, workflow_id: 'main.yml', branch: 'main', head_sha: context.sha,
                status: 'completed', per_page: 100,
              });
              const matching = runs.filter(run => ['push', 'workflow_dispatch'].includes(run.event) &&
                run.head_sha === context.sha);
              if (matching.some(run => run.conclusion === 'success')) {
                validated = true;
                break;
              }
              if (matching.some(run => run.conclusion === 'failure')) {
                throw new Error('Main validation failed for the release commit');
              }
              if (attempt < 19) {
                core.info('Waiting for main validation at the release commit');
                await new Promise(resolve => setTimeout(resolve, 30000));
              }
            }
            if (!validated) throw new Error('Timed out waiting for successful main validation');
      - name: Release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Verify immutable setting and publication state
        id: state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ needs.entry.outputs.version }}
          RELEASE_SETTINGS_REVIEW: ${{ vars.RELEASE_SETTINGS_REVIEW }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/release-settings.cjs').verify({
              github, context, review: process.env.RELEASE_SETTINGS_REVIEW,
            });
            const tag = `v${process.env.VERSION}`;
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('published', 'false');
              return;
            }
            await require('./.github/scripts/release-follow-up.cjs').verifyPublished({
              github, context, version: process.env.VERSION,
            });
            core.setOutput('published', 'true');
      - name: Verify existing release checksum
        if: steps.state.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.entry.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir existing-release
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" --dir existing-release
          cd existing-release
          sha256sum --check SHA256SUMS
      - name: Freeze main in a release branch
        if: steps.state.outputs.published != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ needs.entry.outputs.version }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const ref = `heads/release/${process.env.VERSION}`;
            const { data: main } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            try {
              const { data: existing } = await github.rest.git.getRef({ ...context.repo, ref });
              if (existing.object.sha !== context.sha) throw new Error('Release branch belongs to another commit');
              core.info('Reusing the prepared release branch');
            } catch (error) {
              if (error.status !== 404) throw error;
              if (main.commit.sha !== context.sha) throw new Error('Main moved before preparation');
              await github.rest.git.createRef({ ...context.repo, ref: `refs/${ref}`, sha: context.sha });
            }
      - name: Prepare local release tag
        if: steps.state.outputs.published != 'true'
        env:
          VERSION: ${{ needs.entry.outputs.version }}
        run: git tag "v${VERSION}" "$GITHUB_SHA"
      - name: Install verified GoReleaser
        if: steps.state.outputs.published != 'true'
        uses: ./.github/actions/setup-goreleaser
      - name: Build deployable binaries
        if: steps.state.outputs.published != 'true'
        run: goreleaser release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build source archive and stage binaries
        if: steps.state.outputs.published != 'true'
        env:
          VERSION: ${{ needs.entry.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          archive="gpu-workload-supervisor-v${VERSION}.tar.gz"
          git archive --format=tar --prefix="gpu-workload-supervisor-v${VERSION}/" HEAD | gzip -n > "release-assets/$archive"
          for arch in amd64 arm64; do
            artifact="gpu-workload-supervisor_${VERSION}_linux_${arch}.tar.gz"
            test -s "dist/$artifact"
            tar -tzf "dist/$artifact" | grep -E '(^|/)gpu-mode$' > /dev/null
            tar -tzf "dist/$artifact" | grep -E '(^|/)gpu-workload-proxy$' > /dev/null
            cp "dist/$artifact" "release-assets/$artifact"
          done
          (cd dist && sha256sum --check checksums.txt)
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        if: steps.state.outputs.published != 'true'
        with:
          version: v0.71.2
      - name: Generate CycloneDX SBOM
        if: steps.state.outputs.published != 'true'
        run: trivy fs --skip-dirs dist --skip-dirs release-assets --format cyclonedx --output release-assets/sbom.cdx.json .
      - name: Checksum all release assets
        if: steps.state.outputs.published != 'true'
        run: |
          cd release-assets
          sha256sum gpu-workload-supervisor*.tar.gz sbom.cdx.json > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest release assets
        if: steps.state.outputs.published != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
            release-assets/sbom.cdx.json
      - name: Publish immutable GitHub release
        if: steps.state.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.entry.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "v${VERSION}" --generate-notes
      - name: Verify published release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ needs.entry.outputs.version }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/release-follow-up.cjs').verifyPublished({
              github, context, version: process.env.VERSION,
            });
      - name: Delete published release branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ needs.entry.outputs.version }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const ref = `heads/release/${process.env.VERSION}`;
            try {
              const { data: branch } = await github.rest.git.getRef({ ...context.repo, ref });
              if (branch.object.sha !== context.sha) throw new Error('Release branch SHA changed');
              await github.rest.git.deleteRef({ ...context.repo, ref });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Release branch already removed');
            }

  release-followup:
    name: reserve next patch after v${{ needs.entry.outputs.version }}
    needs: [entry, publish]
    runs-on: ubuntu-latest
    environment: release-automation
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install release tools
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
      - name: Release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Queue narrowly validated next patch bump
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.entry.outputs.version }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/release-follow-up.cjs').bumpReleasedVersion({
              github, context, core, version: process.env.VERSION,
            });

