name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: main-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  aislop:
    uses: ./.github/workflows/aislop.yml
  codeql:
    uses: ./.github/workflows/codeql.yml
  update-pr-branches:
    if: vars.RELEASE_APP_ID != ''
    uses: ./.github/workflows/pr-branch-updater.yml
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
  sonar:
    name: sonar
    needs: [quality, aislop, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require current quality coverage outputs
        env:
          GO_COVERAGE_ID: ${{ needs.quality.outputs.go-coverage-id }}
          JAVASCRIPT_COVERAGE_ID: ${{ needs.quality.outputs.javascript-coverage-id }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re

          if any(not re.fullmatch(r'[1-9][0-9]*', os.environ[key]) for key in ('GO_COVERAGE_ID', 'JAVASCRIPT_COVERAGE_ID')):
              raise SystemExit('Missing successful quality coverage outputs; re-run all jobs')
          PYTHON
      - name: Download Go quality coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.quality.outputs.go-coverage-id }}
          path: go-quality-coverage/
      - name: Download JavaScript quality coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.quality.outputs.javascript-coverage-id }}
          path: javascript-quality-coverage/
      - name: Validate and restore quality coverage
        run: |
          python3 .github/scripts/quality-coverage.py restore go go-quality-coverage
          python3 .github/scripts/quality-coverage.py restore javascript javascript-quality-coverage
      - name: Mask configured SonarQube endpoint
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: python3 .github/scripts/mask-sonar-context.py configured
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: tag:github-sonar
          use-cache: 'true'
      - name: Mask advertised SonarQube endpoint
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: python3 .github/scripts/mask-sonar-context.py advertised
      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: SonarQube quality gate
        id: sonar-quality-gate
        timeout-minutes: 6
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        with:
          pollingTimeoutSec: 270
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Synchronize SonarQube findings
        if: ${{ !cancelled() && failure() && steps.sonar-quality-gate.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: python3 .github/scripts/sync-sonar-findings.py .scannerwork/report-task.txt
