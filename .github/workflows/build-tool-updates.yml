name: build tool updates

on:
  schedule:
    - cron: '23 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test update proposals
        run: node --test .github/scripts/build-tool-updates.test.cjs
      - name: Check upstream stable releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await require('./.github/scripts/build-tool-updates.cjs').run({ github, core });
      - name: Save proposed version changes
        run: |
          git rev-parse HEAD > build-tool-updates-base.txt
          git diff -- .github/actions/setup-goreleaser/action.yml .github/workflows/release.yml scripts/third-party-notices.sh > build-tool-updates.patch
      - name: Upload reviewable update proposal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-tool-updates-${{ github.sha }}
          path: |
            build-tool-updates.md
            build-tool-updates-base.txt
            build-tool-updates.patch
          if-no-files-found: error
          retention-days: 30
