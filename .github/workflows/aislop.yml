name: aislop

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  status:
    name: aislop status
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/aislop/package-lock.json
      - run: npm ci --prefix .github/aislop --ignore-scripts --no-audit --no-fund
      - name: Test native runtime import annotations
        run: node --test .github/aislop/native-imports.test.cjs
      - name: Aislop automation quality gate
        run: .github/aislop/node_modules/.bin/aislop ci --human .
      - name: Aislop Go quality gate
        if: always()
        id: go_scan
        run: .github/aislop/node_modules/.bin/aislop ci --sarif internal > aislop.sarif
      - name: Aislop findings gate
        if: always()
        run: python3 .github/scripts/check-scan-reports.py aislop aislop.sarif
      - name: Upload Aislop SARIF
        if: >-
          ${{
            !cancelled() && steps.go_scan.outcome != 'skipped' &&
            (github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository)
          }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: aislop.sarif
          category: .github/workflows/aislop.yml:status
