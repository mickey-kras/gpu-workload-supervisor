name: training-runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: training-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  training-runtime:
    name: training-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
      - name: Install hash-locked SFT runtime and unchanged Axolotl source
        run: |
          python -m venv .training-tools
          .training-tools/bin/python -m pip install uv==0.12.23
          .training-tools/bin/uv venv .training-runtime --python "$(command -v python)"
          .training-tools/bin/uv pip sync --python .training-runtime/bin/python --require-hashes training/axolotl/requirements.txt
          .training-tools/bin/uv pip install --python .training-runtime/bin/python --no-deps --no-build-isolation 'axolotl @ git+https://github.com/axolotl-ai-cloud/axolotl.git@1f1eb05a391c43e65c1c5ee7ec6ea1b8a841d5d1'
      - name: Enforce exact dependency deviations, runtime compatibility and worker boundary
        run: |
          check() { .training-runtime/bin/python -I -S -B training/axolotl/check_environment.py "$@"; }
          check > cpu-smoke.json || { cat cpu-smoke.json; exit 1; }
          # The CI runner has no GPU. The check must reject each preset target with exit status 1.
          for target in smoke-lora representative-qlora; do
            code=0
            check --target "$target" > "$target.json" || code=$?
            if [ "$code" -ne 1 ]; then cat "$target.json"; exit 1; fi
          done
          python3 - <<'PYTHON'
          import json
          reports = {name: json.load(open(name + ".json")) for name in ("cpu-smoke", "smoke-lora", "representative-qlora")}
          cpu = reports.pop("cpu-smoke")
          assert cpu["status"] == "accepted", cpu
          for report in reports.values():
              checks = {check["name"]: check["status"] for check in report["checks"]}
              assert report["status"] == "rejected" and checks["accelerator"] == "fail", report
          PYTHON
          .training-runtime/bin/python -m unittest discover -s tests/training -v
      - name: Train and reload tiny adapter without network access
        run: |
          sudo unshare --net -- timeout 120 "$PWD/.training-runtime/bin/python" training/axolotl/smoke.py
