name: Temporary test diagnostics
on:
  push:
    branches: [feat/lease-gated-workload-proxy]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: go test ./... > TEST_OUTPUT.txt 2>&1 || true
      - run: |
          if git diff --quiet -- TEST_OUTPUT.txt && git ls-files --error-unmatch TEST_OUTPUT.txt >/dev/null 2>&1; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TEST_OUTPUT.txt
          git commit -m "test: capture temporary diagnostics"
          git push
