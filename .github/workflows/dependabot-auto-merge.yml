name: dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependabot-auto-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Read trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: automation
          sparse-checkout: .github/scripts
      - name: Read pinned Dependabot metadata action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dependabot/fetch-metadata
          ref: 25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
          persist-credentials: false
          path: metadata-action
          sparse-checkout: dist
      - name: Metadata App token
        id: metadata-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
      - name: Queue eligible verified updates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          GH_TOKEN: ${{ github.token }}
          METADATA_TOKEN: ${{ steps.metadata-app.outputs.token }}
        with:
          script: |
            await require('./automation/.github/scripts/dependabot-auto-merge.cjs').run({
              github, context, core,
              metadataPath: require('node:path').resolve('metadata-action'),
              mainWorkflow: 'main.yml',
            });
