name: docs-ste

# ASD-STE100 Simplified Technical English gate for the documentation.
# ste-cli checks the writing rules of the standard. Vale checks the STE style of vale-llm-slop.
# Neither tool uses the ASD-STE100 dictionary: the specification does not permit redistribution.

on:
  workflow_call:

concurrency:
  group: docs-ste-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ste-cli:
    name: ste-cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - name: Prepare documentation
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/docs-ste"
          mkdir -p "$stage"
          git ls-files --cached --others --exclude-standard -z -- ':(icase)*.md' ':(icase)*.markdown' |
            while IFS= read -r -d '' path; do
              case "/${path,,}" in
                */.git/*|*/node_modules/*|*/.vale/styles/*) continue ;;
              esac
              case "$path" in
                clients/setup/icons/LICENSES.md|clients/setup/icons/vllm-usage-notice.md) continue ;;
              esac
              test -f "$path" && test ! -L "$path"
              python3 - "$path" <<'PYTHON'
          import pathlib
          import re
          import sys

          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          directive = r"<!--\s*(?:ste-(?:disable(?:-next-line|-line)?|enable)\b|vale\s+(?:off\b|on\b|styles?\s*=|[^\r\n]*=\s*(?:YES|NO|on|off)\b))"
          if re.search(directive, source, re.IGNORECASE):
              raise SystemExit(f"{sys.argv[1]}: linter control comments are not permitted")
          PYTHON
              mkdir -p "$stage/$(dirname -- "$path")"
              # Append a suffix to preserve distinct source paths and use the Markdown parser.
              cp -- "$path" "$stage/$path.md"
            done

      # The action checks the release archive against checksums.txt before it runs. Config: .ste.yml.
      - uses: TudorAndrei/ste-cli@8e73821bba6ef980930553fb24ca1ade2895aabf # v0.10.1
        with:
          version: 0.10.1
          args: >-
            --warnings-as-errors --no-baseline --all ${{ runner.temp }}/docs-ste

  vale:
    name: vale
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit

      - name: Prepare documentation
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/docs-ste"
          mkdir -p "$stage"
          git ls-files --cached --others --exclude-standard -z -- ':(icase)*.md' ':(icase)*.markdown' |
            while IFS= read -r -d '' path; do
              case "/${path,,}" in
                */.git/*|*/node_modules/*|*/.vale/styles/*) continue ;;
              esac
              case "$path" in
                clients/setup/icons/LICENSES.md|clients/setup/icons/vllm-usage-notice.md) continue ;;
              esac
              test -f "$path" && test ! -L "$path"
              python3 - "$path" <<'PYTHON'
          import pathlib
          import re
          import sys

          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          directive = r"<!--\s*(?:ste-(?:disable(?:-next-line|-line)?|enable)\b|vale\s+(?:off\b|on\b|styles?\s*=|[^\r\n]*=\s*(?:YES|NO|on|off)\b))"
          if re.search(directive, source, re.IGNORECASE):
              raise SystemExit(f"{sys.argv[1]}: linter control comments are not permitted")
          PYTHON
              mkdir -p "$stage/$(dirname -- "$path")"
              # Append a suffix to preserve distinct source paths and use the Markdown parser.
              cp -- "$path" "$stage/$path.md"
            done

      # Config: .vale.ini. "vale sync" downloads the pinned vale-llm-slop release.
      - uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: 3.25.1
          files: ${{ runner.temp }}/docs-ste
          config: .vale.ini
          filter_mode: nofilter
          fail_level: warning
          # Without this, the action passes when the findings are more than the annotation limit.
          fail_on_error: true
