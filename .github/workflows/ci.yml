name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: |
          go mod tidy
          echo '--- GO_MOD_BEGIN ---'
          cat go.mod
          echo '--- GO_MOD_END ---'
          echo '--- GO_SUM_BEGIN ---'
          cat go.sum
          echo '--- GO_SUM_END ---'
      - run: go test ./...
      - run: go vet ./...
