name: ci

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/gnome/package-lock.json
      - name: Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Go module lock is current
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Tests, race detector, and coverage
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt
          awk '$1 == "total:" { coverage=$3+0; found=1 } END { if (!found || coverage < 90) exit 1 }' coverage-summary.txt
      - name: Upstream connection reuse benchmark
        run: go test -run '^$' -bench '^BenchmarkDirectIdleReuse$' -benchtime=20x -count=3 ./internal/httptransport

      - name: Package coverage floors
        run: go run github.com/vladopajic/go-test-coverage/v2@v2.19.0 --config=.testcoverage.yml
      - name: Real systemd lifecycle qualification
        run: |
          set -euo pipefail
          qualification_uid="$(id -u)"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@${qualification_uid}.service"
          export XDG_RUNTIME_DIR="/run/user/${qualification_uid}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          systemctl --user show --property=ControlGroup --value -- -.slice
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          go test -race -count=1 -timeout=10m -tags=systemd_integration -run '^TestSystemd' -v ./internal/supervisor
      - name: Go vet
        run: go vet ./...
      - name: Go vulnerability audit
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ steps.go.outputs.go-version }}
          check-latest: false
          go-package: ./...
          repo-checkout: false
          cache: false
      - name: GNOME contract and lifecycle fixtures
        run: |
          npm ci --prefix clients/gnome --ignore-scripts --no-audit --no-fund
          npm audit --prefix clients/gnome --audit-level=moderate
          npm run coverage --prefix clients/gnome
      - name: Audit Aislop toolchain
        run: |
          npm ci --prefix .github/aislop --ignore-scripts --no-audit --no-fund
          npm audit --prefix .github/aislop --audit-level=moderate
      - name: Test policy automation
        run: |
          npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
          npm audit --prefix .github/scripts --audit-level=moderate
          node --test .github/scripts/*.test.cjs
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      - name: Semgrep
        run: |
          SEMGREP_IMAGE="semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b"
          docker pull "$SEMGREP_IMAGE"
          docker run --rm -v "${PWD}:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config .semgrep.yml --exclude .semgrep.yml --error
      - name: Trivy filesystem report
        id: trivy_report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && steps.trivy_report.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-results.sarif
          category: .github/workflows/ci.yml:fs
      - name: Trivy high and critical gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Install verified GoReleaser
        uses: ./.github/actions/setup-goreleaser
      - name: Validate GoReleaser configuration
        run: goreleaser check
      - name: Build snapshot artifacts
        run: goreleaser release --snapshot --clean
      - name: Verify snapshot archives
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            archives=(dist/gpu-workload-supervisor_*_linux_${arch}.tar.gz)
            test "${#archives[@]}" -eq 1
            test -s "${archives[0]}"
            tar -tzf "${archives[0]}" | grep -E '(^|/)gpu-mode$' > /dev/null
            tar -tzf "${archives[0]}" | grep -E '(^|/)gpu-workload-proxy$' > /dev/null
            bash scripts/check-archive-notices.sh "${archives[0]}"
          done
          (cd dist && sha256sum --check checksums.txt)

      - name: Verify snapshot desktop packages
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            packages=(dist/gpu-workload-supervisor_*_linux_${arch}.deb)
            test "${#packages[@]}" -eq 1
            bash scripts/check-desktop-package.sh "${packages[0]}"
          done

      - name: Sonar privacy tests
        run: python3 -m unittest discover -s tests -p test_sonar_privacy.py

      - name: Native desktop transport integration
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gjs python3
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT timeout 180s bash scripts/native-desktop-integration.sh --isolated-test-host
      - name: Packaged setup lifecycle integration
        run: |
          set -euo pipefail
          packages=(dist/gpu-workload-supervisor_*_linux_amd64.deb)
          test "${#packages[@]}" -eq 1
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT timeout 300s bash scripts/setup-desktop-integration.sh --isolated-test-host "${packages[0]}"
      - name: Debian payload lifecycle integration
        run: |
          set -euo pipefail
          packages=(dist/gpu-workload-supervisor_*_linux_amd64.deb)
          test "${#packages[@]}" -eq 1
          sudo timeout 120s bash scripts/check-desktop-deb-lifecycle.sh "${packages[0]}"

      - name: Prepare CI-tested candidate artifacts
        id: candidate
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          built_commit="$(git rev-parse HEAD)"
          echo "commit=$built_commit" >> "$GITHUB_OUTPUT"
          mkdir candidate-artifacts
          cp dist/*.tar.gz dist/*.deb dist/checksums.txt candidate-artifacts/
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess

          manifest = {
              "schemaVersion": 1,
              "kind": "ci-tested-snapshot-candidate",
              "repository": os.environ["GITHUB_REPOSITORY"],
              # Pull request checkout builds the tested synthetic merge, not its head.
              "builtCommit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "eventCommit": os.environ["GITHUB_SHA"],
              "pullRequestHead": os.environ.get("PR_HEAD_SHA") or None,
              "pullRequestBase": os.environ.get("PR_BASE_SHA") or None,
              "eventName": os.environ["GITHUB_EVENT_NAME"],
              "runID": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runURL": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "qualification": "CI fixture checks; real GPU and GNOME host qualification remains required",
          }
          pathlib.Path("candidate-artifacts/candidate-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PYTHON
          (cd candidate-artifacts && sha256sum candidate-manifest.json >> checksums.txt && sha256sum --check checksums.txt)
      - name: Upload CI-tested candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ steps.candidate.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
