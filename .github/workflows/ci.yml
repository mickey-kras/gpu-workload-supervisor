name: ci

on:
  workflow_call:
    inputs:
      validation-mode:
        type: string
        required: false
        default: full
    outputs:
      go-coverage-id:
        description: Successful Go quality coverage artifact
        value: ${{ jobs.go.outputs.coverage-id }}
      javascript-coverage-id:
        description: Successful JavaScript quality coverage artifact
        value: ${{ jobs.frontend.outputs.coverage-id }}

permissions:
  contents: read
  security-events: write

jobs:
  native:
    if: ${{ github.event_name != 'pull_request' || inputs.validation-mode != 'docs-only' }}
    name: native
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install native setup fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gjs gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth dbus-x11 xdotool imagemagick python3-pyatspi at-spi2-core gsettings-desktop-schemas librsvg2-common
      - name: Native GTK setup, accessibility and screenshot matrix
        run: python3 tests/desktop/setup_native.py --output native-setup-evidence/shard-${{ matrix.shard }} --shard-index ${{ matrix.shard }} --shard-count 6
      - name: Upload native setup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-setup-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-setup-evidence/
          if-no-files-found: error
          retention-days: 14

  go:
    name: go
    outputs:
      coverage-id: ${{ steps.coverage.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/gnome/package-lock.json
      - name: Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Go module lock is current
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Tests, race detector, and coverage
        if: ${{ github.event_name != 'pull_request' || inputs.validation-mode != 'docs-only' }}
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt
          awk '$1 == "total:" { coverage=$3+0; found=1 } END { if (!found || coverage < 90) exit 1 }' coverage-summary.txt
      - name: Upstream connection reuse benchmark
        if: ${{ github.event_name != 'pull_request' || inputs.validation-mode != 'docs-only' }}
        run: go test -run '^$' -bench '^BenchmarkDirectIdleReuse$' -benchtime=20x -count=3 ./internal/httptransport

      - name: Package coverage floors
        if: ${{ github.event_name != 'pull_request' || inputs.validation-mode != 'docs-only' }}
        run: go run github.com/vladopajic/go-test-coverage/v2@v2.19.0 --config=.testcoverage.yml
      - name: Real systemd lifecycle qualification
        if: ${{ github.event_name != 'pull_request' || inputs.validation-mode != 'docs-only' }}
        run: |
          set -euo pipefail
          qualification_uid="$(id -u)"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@${qualification_uid}.service"
          export XDG_RUNTIME_DIR="/run/user/${qualification_uid}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          systemctl --user show --property=ControlGroup --value -- -.slice
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          go test -race -count=1 -timeout=10m -tags=systemd_integration -run '^TestSystemd' -v ./internal/supervisor
      - name: Go vet
        if: ${{ github.event_name != 'pull_request' || inputs.validation-mode != 'docs-only' }}
        run: go vet ./...
      - name: Go cognitive complexity
        if: ${{ github.event_name != 'pull_request' || inputs.validation-mode != 'docs-only' }}
        run: |
          go run .github/scripts/check-go-directives.go .
          go run github.com/uudashr/gocognit/cmd/gocognit@v1.3.0 -over 15 -test=false -ignore '(^|/)(\.github|docs|node_modules)/' .
      - name: Test Go suppression guard
        run: go test .github/scripts/check-go-directives.go .github/scripts/check-go-directives_test.go
      - name: Go vulnerability audit
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ steps.go.outputs.go-version }}
          check-latest: false
          go-package: ./...
          repo-checkout: false
          cache: false

      - name: Stage go quality coverage
        if: ${{ github.event_name != 'pull_request' || inputs.validation-mode != 'docs-only' }}
        run: python3 .github/scripts/quality-coverage.py stage go go-quality-coverage
      - name: Upload go quality coverage
        if: ${{ github.event_name != 'pull_request' || inputs.validation-mode != 'docs-only' }}
        id: coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-quality-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: go-quality-coverage/
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: frontend
    outputs:
      coverage-id: ${{ steps.coverage.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/gnome/package-lock.json
      - name: GNOME contract and lifecycle fixtures
        run: |
          npm ci --prefix clients/gnome --ignore-scripts --no-audit --no-fund
          npm audit --prefix clients/gnome --audit-level=moderate
          npm run coverage --prefix clients/gnome
      - name: Audit Aislop toolchain
        run: |
          npm ci --prefix .github/aislop --ignore-scripts --no-audit --no-fund
          npm audit --prefix .github/aislop --audit-level=moderate
      - name: Test policy automation
        run: |
          npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
          npm audit --prefix .github/scripts --audit-level=moderate
          node --test .github/scripts/*.test.cjs
      - name: JavaScript maintainability
        run: .github/scripts/node_modules/.bin/eslint --config .github/scripts/eslint.config.cjs --max-warnings 0 .
      - name: Sonar privacy tests
        run: python3 -m unittest discover -s tests -p test_sonar_privacy.py

      - name: CI shard regressions
        run: python3 -m unittest discover -s tests/desktop -p test_setup_native_shards.py

      - name: Stage javascript quality coverage
        run: python3 .github/scripts/quality-coverage.py stage javascript javascript-quality-coverage
      - name: Upload javascript quality coverage
        id: coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: javascript-quality-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: javascript-quality-coverage/
          if-no-files-found: error
          retention-days: 1

  scans:
    name: scans
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      - name: Semgrep
        run: |
          SEMGREP_IMAGE="semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b"
          docker pull "$SEMGREP_IMAGE"
          docker run --rm -v "${PWD}:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config .semgrep.yml --exclude .semgrep.yml --error
      - name: Test setup shared-literal rule
        run: |
          docker run --rm -v "${PWD}:/src" -w /src \
            semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b \
            semgrep --test --config .semgrep.yml .github/semgrep-tests/maintainability.go
      - name: Trivy filesystem report
        id: trivy_report
        env:
          TRIVY_SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Trivy conversion regressions
        run: python3 -m unittest discover -s tests -p test_trivy_convert.py
      - name: Convert Trivy SARIF
        id: trivy_sarif
        run: |
          python3 .github/scripts/check-scan-reports.py trivy trivy-results.json
          trivy convert --format sarif --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --output trivy-results.sarif trivy-results.json
      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && steps.trivy_sarif.outcome == 'success' && steps.trivy_report.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: trivy-results.sarif
          category: .github/workflows/ci.yml:fs
      - name: Trivy high and critical gate
        run: trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 trivy-results.json

  package:
    name: package
    outputs:
      payload-id: ${{ steps.payload.outputs.artifact-id }}
      qualified-attempt: ${{ steps.qualification.outputs.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/gnome/package-lock.json
      - name: Install native setup fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gjs gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth dbus-x11 xdotool imagemagick python3-pyatspi at-spi2-core gsettings-desktop-schemas librsvg2-common
      - name: Install verified GoReleaser
        uses: ./.github/actions/setup-goreleaser
      - name: Validate GoReleaser configuration
        run: goreleaser check
      - name: Build snapshot artifacts
        run: goreleaser release --snapshot --clean
      - name: Verify snapshot archives
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            archives=(dist/gpu-workload-supervisor_*_linux_${arch}.tar.gz)
            test "${#archives[@]}" -eq 1
            test -s "${archives[0]}"
            tar -tzf "${archives[0]}" | grep -E '(^|/)gpu-mode$' > /dev/null
            tar -tzf "${archives[0]}" | grep -E '(^|/)gpu-workload-proxy$' > /dev/null
            bash scripts/check-archive-notices.sh "${archives[0]}"
          done
          (cd dist && sha256sum --check checksums.txt)

      - name: Verify snapshot desktop packages
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            packages=(dist/gpu-workload-supervisor_*_linux_${arch}.deb)
            test "${#packages[@]}" -eq 1
            bash scripts/check-desktop-package.sh "${packages[0]}"
          done

      - name: Native desktop transport integration
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT timeout 180s bash scripts/native-desktop-integration.sh --isolated-test-host
      - name: Packaged setup lifecycle integration
        run: |
          set -euo pipefail
          packages=(dist/gpu-workload-supervisor_*_linux_amd64.deb)
          test "${#packages[@]}" -eq 1
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT timeout 300s bash scripts/setup-desktop-integration.sh --isolated-test-host "${packages[0]}"
      - name: Debian payload lifecycle integration
        run: |
          set -euo pipefail
          packages=(dist/gpu-workload-supervisor_*_linux_amd64.deb)
          test "${#packages[@]}" -eq 1
          sudo timeout 120s bash scripts/check-desktop-deb-lifecycle.sh "${packages[0]}"

      - name: Record qualified package attempt
        id: qualification
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload qualified package payload
        id: payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/checksums.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  checks:
    name: checks
    if: ${{ always() }}
    needs: [native, go, frontend, scans, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require every CI job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
          CI_MODE: ${{ inputs.validation-mode }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re

          required = {'native', 'go', 'frontend', 'scans', 'package'}
          results = json.loads(os.environ['CI_NEEDS'])
          docs = os.environ['CI_EVENT'] == 'pull_request' and os.environ['CI_MODE'] == 'docs-only'
          expected = {job: ('skipped' if docs and job == 'native' else 'success') for job in required}
          if set(results) != required or any(results[job].get('result') != expected[job] for job in required):
              raise SystemExit('Required CI work did not succeed: ' + json.dumps(results, sort_keys=True))
          outputs = results['package'].get('outputs', {})
          if any(not re.fullmatch(r'[1-9][0-9]*', outputs.get(key, '')) for key in ('payload-id', 'qualified-attempt')):
              raise SystemExit('Missing qualified package output; re-run all jobs instead of selecting another artifact')
          PYTHON
      - name: Download qualified package payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.payload-id }}
          path: dist/
      - name: Prepare CI-tested candidate artifacts
        if: ${{ github.event_name != 'pull_request' || inputs.validation-mode != 'docs-only' }}
        id: candidate
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PACKAGE_QUALIFICATION_ATTEMPT: ${{ needs.package.outputs.qualified-attempt }}
        run: |
          set -euo pipefail
          built_commit="$(git rev-parse HEAD)"
          echo "commit=$built_commit" >> "$GITHUB_OUTPUT"
          mkdir candidate-artifacts
          cp dist/*.tar.gz dist/*.deb dist/checksums.txt candidate-artifacts/
          python3 - <<'PYTHON'
          import json
          import os
          import pathlib
          import subprocess

          manifest = {
              "schemaVersion": 1,
              "kind": "ci-tested-snapshot-candidate",
              "repository": os.environ["GITHUB_REPOSITORY"],
              # Pull request checkout builds the tested synthetic merge, not its head.
              "builtCommit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "eventCommit": os.environ["GITHUB_SHA"],
              "pullRequestHead": os.environ.get("PR_HEAD_SHA") or None,
              "pullRequestBase": os.environ.get("PR_BASE_SHA") or None,
              "eventName": os.environ["GITHUB_EVENT_NAME"],
              "runID": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "packageQualificationAttempt": os.environ["PACKAGE_QUALIFICATION_ATTEMPT"],
              "runURL": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "qualification": "CI fixture checks; real GPU and GNOME host qualification remains required",
          }
          pathlib.Path("candidate-artifacts/candidate-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PYTHON
          (cd candidate-artifacts && sha256sum candidate-manifest.json >> checksums.txt && sha256sum --check checksums.txt)
      - name: Upload CI-tested candidate artifacts
        if: ${{ github.event_name != 'pull_request' || inputs.validation-mode != 'docs-only' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ steps.candidate.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
