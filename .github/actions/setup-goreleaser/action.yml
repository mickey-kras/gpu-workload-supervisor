name: Verified GoReleaser
description: Install GoReleaser only after mandatory signature and archive verification
runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.0.6
    - name: Verify and install GoReleaser
      shell: bash
      run: bash .github/scripts/install-goreleaser.sh v2.18.2
