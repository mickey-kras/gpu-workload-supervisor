version: 2

project_name: gpu-workload-supervisor

before:
  hooks:
    - bash scripts/third-party-notices.sh

builds:
  - id: gpu-mode
    main: ./cmd/gpu-mode
    binary: gpu-mode
    ldflags:
      - -s -w -X github.com/mickey-kras/gpu-workload-supervisor/internal/deployment.Release={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: gpu-workload-proxy
    main: ./cmd/gpu-workload-proxy
    binary: gpu-workload-proxy
    ldflags:
      - -s -w -X github.com/mickey-kras/gpu-workload-supervisor/internal/deployment.Release={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: gpu-operator
    main: ./cmd/gpu-operator
    binary: gpu-operator
    ldflags:
      - -s -w -X github.com/mickey-kras/gpu-workload-supervisor/internal/deployment.Release={{ .Version }}
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
  - id: gpu-setup
    main: ./cmd/gpu-setup
    binary: gpu-setup
    ldflags:
      - -s -w -X github.com/mickey-kras/gpu-workload-supervisor/internal/deployment.Release={{ .Version }}
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]

nfpms:
  - id: desktop
    package_name: gpu-workload-supervisor
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_linux_{{ .Arch }}"
    ids: [gpu-mode, gpu-workload-proxy, gpu-operator, gpu-setup]
    formats: [deb]
    bindir: /usr/bin
    maintainer: gpu-workload-supervisor maintainers <noreply@github.com>
    homepage: https://github.com/mickey-kras/gpu-workload-supervisor
    description: Local GPU workload controls and guided GNOME Shell 50 setup
    license: MIT
    dependencies:
      - gjs
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - librsvg2-common
      - gnome-shell (>= 50)
      - gnome-shell (<< 51)
      - systemd
    contents:
      - src: clients/gnome/gpu-workload-supervisor@local/*
        dst: /usr/share/gnome-shell/extensions/gpu-workload-supervisor@local/
      - src: clients/setup/onboarding.mjs
        dst: /usr/share/gpu-workload-supervisor/onboarding.mjs
      - src: clients/setup/discovery-inputs.mjs
        dst: /usr/share/gpu-workload-supervisor/discovery-inputs.mjs
      - src: clients/setup/launch-ui.mjs
        dst: /usr/share/gpu-workload-supervisor/launch-ui.mjs
      - src: clients/setup/temporary-discovery-ui.mjs
        dst: /usr/share/gpu-workload-supervisor/temporary-discovery-ui.mjs
      - src: clients/setup/profile-ui.mjs
        dst: /usr/share/gpu-workload-supervisor/profile-ui.mjs
      - src: clients/setup/discovery-ui.mjs
        dst: /usr/share/gpu-workload-supervisor/discovery-ui.mjs
      - src: clients/setup/review.mjs
        dst: /usr/share/gpu-workload-supervisor/review.mjs
      - src: clients/setup/setup-layout.mjs
        dst: /usr/share/gpu-workload-supervisor/setup-layout.mjs
      - src: clients/setup/setup-window.mjs
        dst: /usr/share/gpu-workload-supervisor/setup-window.mjs
      - src: clients/setup/presentation.mjs
        dst: /usr/share/gpu-workload-supervisor/presentation.mjs
      - src: clients/setup/icons/
        dst: /usr/share/gpu-workload-supervisor/icons/
        type: tree
      - src: clients/setup/setup.js
        dst: /usr/share/gpu-workload-supervisor/setup.js
      - src: clients/setup/gpu-workload-supervisor-setup.desktop
        dst: /usr/share/applications/gpu-workload-supervisor-setup.desktop
      - src: packaging/gpu-workload-supervisor-reconcile.service
        dst: /usr/lib/systemd/user/gpu-workload-supervisor-reconcile.service
      - src: packaging/gpu-workload-supervisor-idle.service
        dst: /usr/lib/systemd/user/gpu-workload-supervisor-idle.service
      - src: packaging/gpu-workload-supervisor-idle.timer
        dst: /usr/lib/systemd/user/gpu-workload-supervisor-idle.timer
      - src: LICENSE
        dst: /usr/share/doc/gpu-workload-supervisor/copyright
      - src: THIRD_PARTY_NOTICES/
        dst: /usr/share/doc/gpu-workload-supervisor/THIRD_PARTY_NOTICES/
        type: tree

archives:
  - formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES/**/*
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  disable: true
