ci:
  failBelow: 100

telemetry:
  enabled: false

exclude:
  - node_modules
  - coverage.out
  - package-lock.json

rules:
  security/hardcoded-secret: error
  security/vulnerable-dependency: off

imports:
  # PyPI distribution graphifyy (.github/graphify/requirements.txt) installs module graphify.
  provided:
    - graphify
